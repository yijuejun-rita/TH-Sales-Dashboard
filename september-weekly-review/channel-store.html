<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel & Store | September 2026 Weekly Sales Review</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div class="page">
  <div id="nav"></div>
  <h1>Channel & Store Performance</h1>
  <p class="subtitle">渠道与门店销量表现（店铺销量口径）&middot; 单位 <b>THB</b> &middot; September Weeks 1–3 | Month Not Closed</p>
  <div id="scopeBanner"></div>

  <h2 class="section-title">渠道表现</h2>
  <div class="table-wrap"><table id="channelTable"><thead></thead><tbody></tbody></table></div>

  <div class="chart-card">
    <p class="chart-title">Channel W3 vs W2 Change Rate</p>
    <p class="chart-subtitle">横向条形图 &middot; 含 0% 参考线 &middot; 单位 %</p>
    <div class="chart-canvas-wrap short"><canvas id="changeRateChart"></canvas></div>
  </div>

  <h2 class="section-title">门店表现</h2>
  <div class="filter-bar" id="filterBar">
    <div class="filter-group">
      <label for="channelSel">Channel</label>
      <select id="channelSel"></select>
    </div>
    <div class="filter-group">
      <input type="text" id="storeSearch" class="search-input" placeholder="搜索门店名称...">
    </div>
    <div class="pill-toggle" id="sortToggle">
      <button data-sort="sales" class="active">按 W3 销量</button>
      <button data-sort="growth">Top 增长</button>
      <button data-sort="decline">Top 下降</button>
    </div>
  </div>
  <div class="table-wrap"><table id="storeTable"><thead></thead><tbody></tbody></table></div>

  <h2 class="section-title">门店数据限制 Data Quality</h2>
  <div id="storeDqPanel" class="dq-panel"></div>

  <p class="footer-note" id="footerNote"></p>
</div>
<script src="common.js"></script>
<script src="channel-store.js"></script>
</body>
</html>
