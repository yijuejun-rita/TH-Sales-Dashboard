<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category & SKU | September 2026 Weekly Sales Review</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div class="page">
  <div id="nav"></div>
  <h1>Category & SKU Performance</h1>
  <p class="subtitle">品类与SKU销量表现（渠道SKU周度表口径）&middot; 单位 <b>PCS</b> &middot; September Weeks 1–3 | Month Not Closed</p>
  <div id="scopeBanner"></div>
  <div id="coverageBanner"></div>

  <h2 class="section-title">品类表现</h2>
  <div class="table-wrap"><table id="categoryTable"><thead></thead><tbody></tbody></table></div>

  <div class="chart-card">
    <p class="chart-title">Category Sep W3 Units (sorted)</p>
    <p class="chart-subtitle">横向条形图 &middot; 单位 PCS &middot; 覆盖 Beautrium + Eveandboy + KIS</p>
    <div class="chart-canvas-wrap short"><canvas id="categoryBarChart"></canvas></div>
  </div>

  <h2 class="section-title">SKU 驱动分析</h2>
  <div class="filter-bar" id="filterBar">
    <div class="filter-group">
      <label for="categoryFilterSel">Category</label>
      <select id="categoryFilterSel"></select>
    </div>
    <div class="filter-group">
      <input type="text" id="skuSearch" class="search-input" placeholder="搜索 SKU 名称 / Barcode...">
    </div>
  </div>
  <p class="footer-note" style="margin-top:0;">默认按 |W3 − W2| 绝对变化从高到低排序。</p>
  <div class="table-wrap"><table id="skuTable"><thead></thead><tbody></tbody></table></div>

  <h2 class="section-title">数据质量 Data Quality（品类 / SKU）</h2>
  <div id="skuDqPanel" class="dq-panel"></div>

  <p class="footer-note" id="footerNote"></p>
</div>
<script src="common.js"></script>
<script src="category-sku.js"></script>
</body>
</html>
