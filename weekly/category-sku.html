<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category & SKU Performance | Thailand KA Sales</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div class="page">
  <div id="nav"></div>
  <h1>Category & SKU Performance</h1>
  <p class="subtitle">品类与SKU销量表现（SKU销量口径 —— 前4个渠道SKU表汇总）&middot; 单位 PCS</p>
  <div id="syncStatus" class="sync-status"></div>

  <div class="filter-bar" id="filterBar">
    <div class="filter-group">
      <label for="weekSel">Week</label>
      <select id="weekSel"></select>
    </div>
  </div>

  <h2 class="section-title">品类表现</h2>
  <div class="table-wrap"><table id="categoryTable"><thead></thead><tbody></tbody></table></div>

  <div class="chart-card">
    <p class="chart-title">Category Weekly Sales (sorted)</p>
    <p class="chart-subtitle">横向条形图 &middot; 从高到低排序 &middot; 单位 PCS &middot; SKU口径</p>
    <div class="chart-canvas-wrap short"><canvas id="categoryBarChart"></canvas></div>
  </div>

  <h2 class="section-title">品类到SKU下钻</h2>
  <div class="filter-bar">
    <div class="filter-group">
      <label for="drillCategorySel">Category</label>
      <select id="drillCategorySel"></select>
    </div>
    <div class="filter-group">
      <input type="text" id="skuSearch" class="search-input" placeholder="搜索SKU名称...">
    </div>
  </div>
  <div class="table-wrap"><table id="skuTable"><thead></thead><tbody></tbody></table></div>

  <h2 class="section-title">SKU &times; 渠道拆解</h2>
  <div class="filter-bar">
    <div class="filter-group">
      <label for="skuSel">选择 SKU</label>
      <select id="skuSel"></select>
    </div>
  </div>
  <div class="two-col">
    <div class="table-wrap"><table id="skuChannelTable"><thead></thead><tbody></tbody></table></div>
    <div class="chart-card" style="margin-bottom:0;">
      <p class="chart-title">该 SKU 各渠道本周销量</p>
      <div class="chart-canvas-wrap short"><canvas id="skuChannelChart"></canvas></div>
    </div>
  </div>

  <h2 class="section-title">SKU 预警</h2>
  <div id="skuAlerts" class="dq-panel"></div>

  <h2 class="section-title">数据质量 Data Quality</h2>
  <div id="dqPanel" class="dq-panel"></div>

  <p class="footer-note" id="footerNote"></p>
</div>
<script src="common.js"></script>
<script src="category-sku.js"></script>
</body>
</html>
